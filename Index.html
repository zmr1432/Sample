<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ఫుల్ స్క్రీన్ వెబ్‌సైట్</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>

  <h1>వెబ్‌సైట్‌కి స్వాగతం</h1>

  <script>
    function openFullscreen() {
      var elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) { /* Safari */
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) { /* IE11 */
        elem.msRequestFullscreen();
      }
    }

    // బ్రౌజర్ భద్రతా కారణాల వల్ల,
    // సాధారణంగా ఏదైనా బటన్ క్లిక్ చేసినప్పుడు మాత్రమే ఫుల్ స్క్రీన్ అవుతుంది.
    // అయితే, ఈ పేజ్ లోడ్ అయిన వెంటనే ఫుల్ స్క్రీన్ అవ్వడానికి ప్రయత్నిద్దాం.

    window.onload = function() {
      openFullscreen();
    };
  </script>
</body>
</html>
